  fill="#fff" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
  <!-- 本体 -->
  <rect x="4" y="2" width="140" height="75" stroke-width="4" />
  <!-- コの字フォーク（左右の脚＋底板） -->
  <rect x="2" y="77" width="8" height="31" stroke-width="4" />
  <rect x="138" y="77" width="8" height="31" stroke-width="4" />
  <rect x="2" y="102" width="144" height="6" stroke-width="4" />
</svg>
