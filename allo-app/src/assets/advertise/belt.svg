<svg width="100%" height="100%" viewBox="0 0 800 56" version="1.1" xmlns="http://www.w3.org/2000/svg"
  fill="#fff" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="2" width="796" height="52" rx="26" ry="26" stroke-width="4" />
  <line x1="30" y1="28" x2="770" y2="28" stroke-width="2" stroke-opacity="0.25" fill="none" />
</svg>
