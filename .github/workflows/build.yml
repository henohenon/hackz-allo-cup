name: build

# vN タグ push 時のみビルドし、GitHub Release に成果物を添付する。
# (毎 push の重いビルドとダウンロードを避けるため)
on:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: allo-app

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: allo-app/pnpm-lock.yaml

      # bleno/noble の node-gyp は Python 3.11 が必要
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            allo-app/release/**/*.dmg
            allo-app/release/**/*.exe
