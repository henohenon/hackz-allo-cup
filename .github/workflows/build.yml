name: build

# vN タグ push 時のみビルドし、GitHub Release に成果物を添付する。
# (毎 push の重いビルドとダウンロードを避けるため)
on:
  push:
    tags: ["v*"]

# 同一タグで古い実行が走っていればキャンセルする
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: allo-app

jobs:
  build:
    permissions:
      contents: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Electron / electron-builder のキャッシュ先を全 OS で統一する
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v5

      # pnpm のバージョンは package.json の packageManager から取得する
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: allo-app/pnpm-lock.yaml

      # Electron 本体 / electron-builder のツール DL をキャッシュ
      - name: Cache electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('allo-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # タグ (vX.Y.Z) から package.json の version を注入し、資産名/表示版を正す
      - name: Set version from tag
        shell: bash
        run: pnpm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build
        run: pnpm run build

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            allo-app/release/**/*.zip
            allo-app/release/**/*.exe
          body: |
            ## インストール方法

            ### macOS
            `Kotohakobi-Mac-<version>-arm64.zip` / `-x64.zip`

            - Apple Silicon (M1 以降) は **arm64**、Intel Mac は **x64** をダウンロード
            - zip を解凍すると `Kotohakobi.app` が出てきます (置き場所はどこでも可。「アプリケーション」へ移動しなくても起動できます)
            - 署名していないため初回は警告が出ます。次のどちらかで起動してください:
              - `Kotohakobi.app` を **右クリック →「開く」** → ダイアログで「開く」
              - それでも開けない場合はターミナルで以下を実行 (パスは置いた場所に合わせる。`xattr -dr com.apple.quarantine ` まで打ってから .app をターミナルにドラッグ&ドロップすると確実):
                ```
                xattr -dr com.apple.quarantine ~/Downloads/Kotohakobi.app
                ```

            ### Windows
            `Kotohakobi-Windows-<version>.exe`

            - exe をダウンロードしてそのまま実行 (インストール不要)
            - SmartScreen の警告が出たら **「詳細情報」→「実行」**
