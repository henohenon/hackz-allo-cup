name: build

# vN タグ push 時のみビルド (毎 push の重いビルドを避ける)。
# 手動実行 (workflow_dispatch) では確認用に artifact を生成する。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: allo-app

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: kotohakobi-mac
          - os: windows-latest
            artifact: kotohakobi-win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: allo-app/pnpm-lock.yaml

      # bleno/noble の node-gyp は Python 3.11 が必要
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # タグ push 以外 (手動実行) は確認用に artifact として保存
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            allo-app/release/**/*.dmg
            allo-app/release/**/*.exe
          if-no-files-found: warn

      # タグ push (v*) のときは GitHub Release を作成して成果物を添付
      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            allo-app/release/**/*.dmg
            allo-app/release/**/*.exe
