name: build

# vN タグ push 時にビルドした配布物を GitHub Release に添付する。
# (日常の lint/型/ビルド検証は check.yml が担当。ここはリリース公開専用)
on:
  push:
    tags: ["v*"]

# 同一タグで古い実行が走っていればキャンセルする
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: allo-app

jobs:
  build:
    permissions:
      contents: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Electron / electron-builder のキャッシュ先を全 OS で統一する
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v5

      # pnpm のバージョンは allo-app/package.json の packageManager から取得する。
      # action はデフォルトでリポジトリルートの package.json を見るが、ルートには
      # packageManager が無いため package_json_file で明示する。
      # (これを省くと "No pnpm version is specified" でタグビルドが落ちる)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: allo-app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: allo-app/pnpm-lock.yaml

      # Electron 本体 / electron-builder のツール DL をキャッシュ
      - name: Cache electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('allo-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # タグ (vX.Y.Z) から package.json の version を注入し、資産名/表示版を正す。
      # npm pkg set はフィールドを書くだけで git 状態を見ないため、CI 上の
      # 未追跡ファイルで pnpm version が ERR_PNPM_UNCLEAN_WORKING_TREE になるのを避ける。
      - name: Set version from tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build
        run: pnpm run build

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # release/<version>/ 直下の最終成果物のみ添付する。
          # ** だと win-unpacked 配下の中間物 (Kotohakobi.exe / resources/elevate.exe)
          # まで拾ってしまうため * で 1 階層に限定する。
          files: |
            allo-app/release/*/*.zip
            allo-app/release/*/*.exe
          body: |
            ## 📦 インストール

            ### macOS

            Mac に合わせて zip をダウンロード:

            - **Apple Silicon（M1 以降）**: `Kotohakobi-Mac-<version>-arm64.zip`
            - **Intel**: `Kotohakobi-Mac-<version>-x64.zip`

            解凍して出てくる `Kotohakobi.app` は、初回だけターミナルで下記を実行します（`com.apple.quarantine ` まで打ってから `.app` をターミナルにドラッグ&ドロップ）:

            ```
            xattr -dr com.apple.quarantine 
            ```

            あとはダブルクリックで起動できます。

            ### Windows

            `Kotohakobi-Windows-<version>.exe` をダウンロードしてダブルクリック（インストール不要）。SmartScreen が出たら「詳細情報」→「実行」。

            ※Windowsは"送る"ができないようです、申し訳ありませんが"受け取る"と"荷物一覧"でお楽しみください🙏

            ### Android（受信専用）

            `Kotohakobi-Android-<version>.apk` をダウンロードし、端末で「提供元不明のアプリ」を許可してインストール。

            ※Android は **受け取り専用** です。「送る」は Electron（macOS / Windows）側で行ってください。

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: allo-app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: allo-app/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ランナー同梱の Android SDK に cmdline-tools を PATH 通し、必要な platform/build-tools を入れる。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build Android APK
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # セマンティック版から単調増加の versionCode を作る (例: 1.2.3 -> 10203)
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print ($1 * 10000) + ($2 * 100) + $3}')
          pnpm run build:web
          npx cap sync android
          (
            cd android
            ./gradlew assembleRelease --no-daemon \
              -PversionName="$VERSION" \
              -PversionCode="$VERSION_CODE"
          )
          mkdir -p "release/${VERSION}"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "release/${VERSION}/Kotohakobi-Android-${VERSION}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            allo-app/release/*/*.apk
          body: |
            ## 📦 インストール

            ### macOS

            Mac に合わせて zip をダウンロード:

            - **Apple Silicon（M1 以降）**: `Kotohakobi-Mac-<version>-arm64.zip`
            - **Intel**: `Kotohakobi-Mac-<version>-x64.zip`

            解凍して出てくる `Kotohakobi.app` は、初回だけターミナルで下記を実行します（`com.apple.quarantine ` まで打ってから `.app` をターミナルにドラッグ&ドロップ）:

            ```
            xattr -dr com.apple.quarantine 
            ```

            あとはダブルクリックで起動できます。

            ### Windows

            `Kotohakobi-Windows-<version>.exe` をダウンロードしてダブルクリック（インストール不要）。SmartScreen が出たら「詳細情報」→「実行」。

            ※Windowsは"送る"ができないようです、申し訳ありませんが"受け取る"と"荷物一覧"でお楽しみください🙏

            ### Android（受信専用）

            `Kotohakobi-Android-<version>.apk` をダウンロードし、端末で「提供元不明のアプリ」を許可してインストール。

            ※Android は **受け取り専用** です。「送る」は Electron（macOS / Windows）側で行ってください。
