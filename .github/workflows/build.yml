name: build

# vN タグ push 時のみビルドし、GitHub Release に成果物を添付する。
# (毎 push の重いビルドとダウンロードを避けるため)
on:
  push:
    tags: ["v*"]

# 同一タグで古い実行が走っていればキャンセルする
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: allo-app

jobs:
  build:
    permissions:
      contents: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Electron / electron-builder のキャッシュ先を全 OS で統一する
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager から取得する
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: allo-app/pnpm-lock.yaml

      # Electron 本体 / electron-builder のツール DL をキャッシュ
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('allo-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            allo-app/release/**/*.dmg
            allo-app/release/**/*.exe
