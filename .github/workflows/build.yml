name: build

# vN タグ push 時のみビルドし、GitHub Release に成果物を添付する。
# (毎 push の重いビルドとダウンロードを避けるため)
on:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: allo-app

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: allo-app/pnpm-lock.yaml

      # bleno/noble の node-gyp は Python 3.11 が必要
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # タグ (vX.Y.Z) から package.json の version を注入し、資産名/表示版を正す
      - name: Set version from tag
        shell: bash
        run: pnpm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build
        run: pnpm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            allo-app/release/**/*.zip
            allo-app/release/**/*.exe
          body: |
            ## インストール方法

            ### macOS
            `Kotohakobi-Mac-<version>-arm64.zip` / `-x64.zip`

            - Apple Silicon (M1 以降) は **arm64**、Intel Mac は **x64** をダウンロード
            - zip を解凍し `Kotohakobi.app` を「アプリケーション」へ移動
            - 署名していないため初回は警告が出ます。次のどちらかで起動してください:
              - `Kotohakobi.app` を **右クリック →「開く」** → ダイアログで「開く」
              - それでも開けない場合はターミナルで以下を実行:
                ```
                xattr -dr com.apple.quarantine /Applications/Kotohakobi.app
                ```

            ### Windows
            `Kotohakobi-Windows-<version>.exe`

            - exe をダウンロードしてそのまま実行 (インストール不要)
            - SmartScreen の警告が出たら **「詳細情報」→「実行」**
